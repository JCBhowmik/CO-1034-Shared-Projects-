<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Treasure Hunt Game</title>

    <link rel="stylesheet" href="css/app.css">
    <script src="js/app.js" defer></script>
</head>

<body>

<!-- Navigation -->
<header>
    <nav>
        <h1>Treasure Hunt</h1>
        <a href="index.html" title="Back to Homepage">Home</a>
    </nav>
</header>

<main>

    <!-- Game Information -->
    <section class="game-info">

        <div class="score-box">
            <h3>Your Score</h3>
            <p id="score">0 Points</p>
        </div>

        <div class="location-box">
            <h3>Location</h3>
            <p id="location-status">GPS not connected</p>
        </div>

    </section>

    <!-- Question Area -->
    <section class="question-section">

        <h2>Treasure Hunt Challenge</h2>

        <article class="question-card">

            <h3 id="question-title">Question</h3>

            <p id="question-text">
                Your question will appear here.
            </p>

            <form id="answer-form">

                <label for="answer">
                    Your Answer
                </label>

                <input
                        type="text"
                        id="answer"
                        name="answer"
                        placeholder="Enter your answer"
                        required
                >

                <button type="submit" id="submit-answer">
                    Submit Answer
                </button>

            </form>

            <button type="button" id="skip-question">
                Skip Question
            </button>

            <p id="answer-feedback" role="status"
               aria-live="polite"></p>

        </article>

    </section>

    <!-- Leaderboard -->
    <section class="leaderboard-section">

        <h2>Leaderboard</h2>

        <div class="leaderboard-card">
            <p id="leaderboard-status">
                Player rankings will appear here.
            </p>
        </div>

    </section>

</main>

<footer>
    <p>Treasure Hunt Web Application</p>
</footer>

</body>
</html>
